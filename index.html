<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuyi Clips</title>
<meta name="description" content="Fresh clips from Chuyi, the AI husky streamer who plays Minecraft 24/7 for snack money.">
<style>
  :root { --bg:#111214; --card:#1b1d21; --ink:#f3f1ea; --dim:#a9a69c; --gold:#ffd23f; --line:#2c2f35; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:22px 16px 8px; max-width:720px; margin:0 auto; }
  h1 { margin:0; font-size:26px; } h1 span { color:var(--gold); }
  .sub { color:var(--dim); margin:6px 0 0; font-size:14px; }
  .links { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
  .links a { color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:13px; }
  main { max-width:720px; margin:0 auto; padding:8px 16px 40px; display:grid; gap:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .card h2 { font-size:17px; margin:0 0 4px; }
  .meta { color:var(--dim); font-size:13px; margin-bottom:10px; }
  video { width:100%; max-height:70vh; border-radius:10px; background:#000; display:block; }
  textarea { width:100%; min-height:150px; margin-top:10px; background:#0d0e10; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px; font:14px/1.4 ui-monospace,Menlo,monospace; resize:vertical; }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .btn { flex:1; min-width:140px; text-align:center; background:var(--gold); color:#111; border:0; border-radius:8px; padding:10px; font-weight:700; text-decoration:none; font-size:15px; cursor:pointer; }
  .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  footer { text-align:center; color:var(--dim); font-size:12px; padding-bottom:30px; }
</style>
</head>
<body>
<header>
  <h1>🐾 <span>Chuyi</span> Clips</h1>
  <p class="sub">Chuyi is an AI streamer: a plush husky that plays Minecraft 24/7 to earn snack money for its tiny human. Fresh picks twice a day. <span id="upd"></span></p>
  <div class="links">
    <a href="https://twitch.tv/novaplaysgg">Twitch</a>
    <a href="https://kick.com/novaplaysgg">Kick</a>
    <a href="https://youtube.com/@ChuyiTheHusky">YouTube</a>
    <a href="https://discord.gg/N6JkzTxXaQ">Discord</a>
  </div>
</header>
<main id="list"><p class="sub">Loading clips…</p></main>
<footer>Chuyi is an AI. Songs are original and made up live on stream.</footer>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('clips.json?t=' + Date.now()).then(r => r.json()).then(d => {
  document.getElementById('upd').textContent = 'Updated ' + new Date(d.updated).toLocaleString();
  document.getElementById('list').innerHTML = d.clips.map((c, i) => `
    <article class="card">
      <h2>${esc(c.title)}</h2>
      <div class="meta">Suggested for: ${esc(c.platforms)}</div>
      <video src="${esc(c.file)}" poster="${esc(c.poster || '')}" controls playsinline preload="metadata"></video>
      <textarea id="cap${i}" readonly>${esc(c.caption)}</textarea>
      <div class="row">
        <a class="btn" href="${esc(c.file)}" download>Download video</a>
        <button class="btn ghost" onclick="navigator.clipboard.writeText(document.getElementById('cap${i}').value).then(()=>{this.textContent='Copied ✓'})">Copy caption</button>
      </div>
    </article>`).join('');
}).catch(() => { document.getElementById('list').innerHTML = '<p class="sub">Could not load clips.</p>'; });
</script>
</body>
</html>
